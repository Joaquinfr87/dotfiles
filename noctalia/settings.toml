config_version = 14

[bar]
order = [ "topbar-right" ]

    [bar.topbar-right]
    auto_hide = true
    concave_edge_corners = false
    end = [
        "sysmon",
        "temp",
        "cpu",
        "media",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "volume",
        "brightness",
        "battery"
    ]
    font_family = "Iosevka NF"
    reserve_space = false
    start = [ "workspaces" ]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Iosevka NF"

    [shell.launcher]
    app_grid = true

[theme]
builtin = "Gruvbox"
pure_black_dark = true

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/joaquin/Pictures"

    [wallpaper.default]
    path = "/home/joaquin/Pictures/wallpaper4.png"

    [wallpaper.last]
    path = "/home/joaquin/Pictures/wallpaper4.png"

[widget.battery]
display_mode = "graphic"

[widget.cpu]
color = "primary"
stat = "ram_pct"

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
show_label = false
show_vpn_label = true

[widget.sysmon]
color = "primary"

[widget.temp]
color = "primary"
highlight_color = "primary"

[widget.workspaces]
show_all_outputs = true