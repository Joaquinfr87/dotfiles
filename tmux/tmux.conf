# ==============================================================================
# TMUX — Config (Debian 13 + kitty + sway)
# ==============================================================================
# Enfoque: SESIONES y ventanas. Los panes quedan con su comportamiento por
# defecto (no se usan), así que no se añaden atajos de split.
#
# Instalación:  cp tmux/tmux.conf ~/.config/tmux/tmux.conf
# Recarga:      prefix + r   (o `tmux source-file ~/.config/tmux/tmux.conf`)
# Referencia:   man tmux · https://github.com/tmux/tmux/wiki/Getting-Started
#
# Paleta: Gruvbox Material Dark (igual que sway/config.d/00-variables)

# --- Terminal (kitty) --------------------------------------------------------
set -g default-terminal "tmux-256color"

# kitty usa TERM=xterm-kitty. Dos capacidades que tmux no puede adivinar solo:
#   RGB     -> color de 24 bits (que el tema de nvim se vea igual que en kitty)
#   extkeys -> teclado extendido CSI-u (Shift+Enter, etc. en nvim y CLIs)
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-kitty*:RGB:extkeys'
set -as terminal-features ',xterm-256color:RGB:extkeys'

# Fallback: si tmux reconoce Shift+Enter como tecla distinta, inyecta CSI-u.
bind -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75

# Deja pasar secuencias OSC (p. ej. imágenes de `kitten icat`) sin que tmux las coma
set -g allow-passthrough on

# --- Comportamiento general --------------------------------------------------
set -sg escape-time 0          # clave con nvim/kitty: sin retardo en <Esc>
set -g focus-events on         # nvim recibe FocusGained/FocusLost (autoread, etc.)
set -g mouse on                # rueda = scrollback; clic = seleccionar/activar
set -g history-limit 50000
set -g base-index 1            # ventanas numeradas desde 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on     # al cerrar una ventana, no quedan huecos
setw -g aggressive-resize on
set -g detach-on-destroy off   # al matar una sesión salta a la siguiente, no cierra
set -g set-clipboard on        # permite OSC 52 (apps copian al portapapeles)

# --- Estilo vi (editores y copy-mode) ---------------------------------------
setw -g mode-keys vi
set -g status-keys vi

# --- Prefijo: C-Space (con C-b como secundario) -----------------------------
set -g prefix C-Space
# set -g prefix2 C-b
bind C-Space send-prefix

# --- Portapapeles Wayland (wl-clipboard) ------------------------------------
set -s copy-command 'wl-copy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# --- Utilidades propias ------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf recargado"
bind X confirm-before -p "matar sesión #S? (y/n)" kill-session
# Selector de sesiones por proyecto con fzf (ver scripts/tmux-sessionizer)
bind f display-popup -E -w 80% -h 60% "~/.local/bin/tmux-sessionizer"

# --- Persistencia de sesiones (resurrect + continuum) ----------------
# Guardado: C-Space C-s · Restauración: C-Space C-r
# continuum guarda cada N min y restaura solo al arrancar tmux.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'

# Restaurar aplicaciones dentro de los panes (no solo el layout)
# nvim: usa 'session' para restaurar la sesión con persistence.nvim
set -g @resurrect-strategy-nvim 'session'
# Procesos que se restauran automáticamente
set -g @resurrect-processes 'nvim opencode codex python node'
run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux

# --- Scrollback: entrar y navegar copy-mode sin PageUp/PageDown --------------
bind -n M-Up   copy-mode \; send-keys -X page-up
bind -n M-Down copy-mode \; send-keys -X page-down
bind -T copy-mode M-Up   send-keys -X page-up
bind -T copy-mode M-Down send-keys -X page-down

# --- Cambiar de sesión (repetible, sin volver a pulsar el prefijo) -----------
bind -r C-n switch-client -n
bind -r C-p switch-client -p

# --- Barra de estado (Gruvbox Material) --------------------------------------
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#282828,fg=#a89984"
set -g status-position top
set -g status-left-length 40
set -g status-left "#[bg=#b8bb26,fg=#282828,bold] #S #[bg=#3c3836,fg=#b8bb26,nobold] "
set -g status-right ""
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#3c3836,fg=#fabd2f,bold] #I:#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b8bb26"
set -g message-style "bg=#3c3836,fg=#fabd2f"
set -g message-command-style "bg=#3c3836,fg=#fabd2f"
set -g mode-style "bg=#fabd2f,fg=#282828"
