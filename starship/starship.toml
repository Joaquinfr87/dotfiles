# ==============================================================================
# Starship Configuration — Gruvbox Dark (Minimal - 1 line)
# ==============================================================================
# Official documentation: https://starship.rs/config/
# ==============================================================================

# Do not add an extra newline before the prompt (compact prompt)
add_newline = false

# Timeout in milliseconds for external commands (git, etc.)
command_timeout = 500

# Main format on a single line
format = """$os$username$hostname$directory$git_branch$git_state$git_status$package$nodejs$python$rust$golang$docker_context$jobs$sudo$cmd_duration$status$character"""

# --- Main prompt character ---
[character]
success_symbol = "[❯](bold #b8bb26)" # Gruvbox green
error_symbol = "[❯](bold #fb4934)"   # Gruvbox red
vimcmd_symbol = "[❮](bold #fabd2f)"  # Gruvbox yellow (vi normal mode)

# --- Operating system (Debian) ---
[os]
disabled = false
style = "bold #fb4934" # Debian Gruvbox red
format = "[$symbol]($style)"

[os.symbols]
Debian = " "

# --- Directory ---
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #fabd2f" # Gruvbox yellow
read_only = " 󰌾"
read_only_style = "#fb4934"
format = "[$path]($style)[$read_only]($read_only_style) "

# --- Git ---
[git_branch]
symbol = " "
style = "bold #d3869b" # Gruvbox magenta
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold #fe8019" # Gruvbox orange
conflicted = "=[$count](bold #fb4934)"
ahead = "⇡[$count](bold #b8bb26)"
behind = "⇣[$count](bold #fb4934)"
diverged = "⇕[⇡$ahead_count ⇣$behind_count](bold #fabd2f)"
untracked = "?[$count](bold #83a598)"
stashed = "*[$count](bold #928374)"
modified = "![$count](bold #fe8019)"
staged = "+[$count](bold #b8bb26)"
renamed = "»[$count](bold #8ec07c)"
deleted = "✘[$count](bold #fb4934)"
format = '([\[$all_status$ahead_behind\]]($style) )'

[git_state]
format = '([($state( $progress_current/$progress_total))]($style) )'
style = "bold #fabd2f"

# --- Runtimes and languages ---
[nodejs]
symbol = " "
style = "bold #b8bb26" # Gruvbox green
format = "[$symbol($version)]($style) "
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

[python]
symbol = " "
style = "bold #fabd2f" # Gruvbox yellow
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '

[rust]
symbol = "󱘗 "
style = "bold #fe8019" # Gruvbox orange
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "bold #83a598" # Gruvbox blue
format = "[$symbol($version)]($style) "

[docker_context]
symbol = " "
style = "bold #83a598" # Gruvbox blue
format = "[$symbol$context]($style) "

[package]
symbol = "󰏗 "
style = "#928374" # Gruvbox gray
format = "[$symbol$version]($style) "

# --- Background jobs ---
[jobs]
symbol = "✦ "
style = "bold #fabd2f" # Gruvbox yellow
format = "[$symbol$number]($style) "
number_threshold = 1

# --- Sudo ---
[sudo]
disabled = false
symbol = "󰌋 "
style = "bold #fb4934" # Gruvbox red
format = "[$symbol]($style) "

# --- Command duration (when it takes > 2 seconds) ---
[cmd_duration]
min_time = 2_000
style = "bold #fabd2f" # Gruvbox yellow
format = "took [$duration]($style) "

# --- Exit status / errors ---
[status]
disabled = false
symbol = " "
style = "bold #fb4934" # Gruvbox red
format = "[$symbol$status]($style) "

# --- User and host (only active in SSH sessions or as root) ---
[username]
style_user = "bold #83a598"
style_root = "bold #fb4934"
format = "[$user]($style)@"
show_always = false

[hostname]
ssh_only = true
style = "bold #8ec07c"
format = "[$hostname]($style) in "
trim_at = ".company"
