# ==============================================================================
# TMUX — Config (Debian 13 + kitty + sway)
# ==============================================================================
# Focus: SESSIONS and windows. Panes keep their default behavior (they are not
# used), so no split shortcuts are added.
#
# Installation:  cp tmux/tmux.conf ~/.config/tmux/tmux.conf
# Reload:        prefix + r   (or `tmux source-file ~/.config/tmux/tmux.conf`)
# Reference:     man tmux · https://github.com/tmux/tmux/wiki/Getting-Started
#
# Palette: Gruvbox Material Dark (same as sway/config.d/00-variables)

# --- Terminal (kitty) --------------------------------------------------------
set -g default-terminal "tmux-256color"

# kitty uses TERM=xterm-kitty. Two capabilities tmux cannot guess on its own:
#   RGB     -> 24-bit color (so the nvim theme looks the same as in kitty)
#   extkeys -> extended CSI-u keyboard (Shift+Enter, etc. in nvim and CLIs)
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-kitty*:RGB:extkeys'
set -as terminal-features ',xterm-256color:RGB:extkeys'

# Fallback: if tmux recognizes Shift+Enter as a distinct key, inject CSI-u.
bind -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75

# Let OSC sequences through (e.g. `kitten icat` images) without tmux swallowing them
set -g allow-passthrough on

# --- General behavior --------------------------------------------------------
set -sg escape-time 0          # key for nvim/kitty: no delay on <Esc>
set -g focus-events on         # nvim receives FocusGained/FocusLost (autoread, etc.)
set -g mouse on                # wheel = scrollback; click = select/activate
set -g history-limit 50000
set -g base-index 1            # windows numbered from 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on     # closing a window leaves no gaps
setw -g aggressive-resize on
set -g detach-on-destroy off   # killing a session jumps to the next one instead of exiting
set -g set-clipboard on        # enables OSC 52 (apps copy to the clipboard)

# --- Vi style (editors and copy-mode) ----------------------------------------
setw -g mode-keys vi
set -g status-keys vi

# --- Prefix: C-Space (with C-b as secondary) ---------------------------------
set -g prefix C-Space
# set -g prefix2 C-b
bind C-Space send-prefix

# --- Clipboard (Wayland when available, or OSC 52 fallback) ------------------
if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -s copy-command "wl-copy"'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# --- Custom utilities ---------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
# fzf project/session picker (see scripts/tmux-sessionizer)
bind f display-popup -E -w 80% -h 60% "~/.local/bin/tmux-sessionizer"

# --- Session persistence (resurrect + continuum) ------------------------------
# Save: C-Space C-s · Restore: C-Space C-r
# continuum saves every N minutes and restores only when tmux starts.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'

# Restore applications inside panes (not just the layout)
# nvim: use 'session' to restore the session with persistence.nvim
set -g @resurrect-strategy-nvim 'session'
# Processes restored automatically
set -g @resurrect-processes 'nvim opencode codex python node'
run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux

# --- Scrollback: enter and navigate copy-mode without PageUp/PageDown ---------
bind -n M-Up   copy-mode \; send-keys -X page-up
bind -n M-Down copy-mode \; send-keys -X page-down
bind -T copy-mode M-Up   send-keys -X page-up
bind -T copy-mode M-Down send-keys -X page-down

# --- Switch sessions (repeatable, without pressing the prefix again) ----------
bind -r C-n switch-client -n
bind -r C-p switch-client -p

# --- Status bar (Gruvbox Material) --------------------------------------------
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#282828,fg=#a89984"
set -g status-position top
set -g status-left-length 40
set -g status-left "#[bg=#b8bb26,fg=#282828,bold] #S #[bg=#3c3836,fg=#b8bb26,nobold] "
set -g status-right ""
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#3c3836,fg=#fabd2f,bold] #I:#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#b8bb26"
set -g message-style "bg=#3c3836,fg=#fabd2f"
set -g message-command-style "bg=#3c3836,fg=#fabd2f"
set -g mode-style "bg=#fabd2f,fg=#282828"
