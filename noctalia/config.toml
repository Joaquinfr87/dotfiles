# ==============================================================================
# Noctalia v5 - config.toml
# Reference: https://docs.noctalia.dev/v5/
# Validate with: noctalia config validate
# ==============================================================================

# --- Shell ---------------------------------------------------------------
[shell]
font_family = "Iosevka"
polkit_agent = true            # built-in authentication agent
password_style = "random"
clipboard_enabled = true

[shell.panel]
transparency_mode = "solid"

[shell.launcher]
categories = true
show_icons = true
sort_by_usage = true

# --- Wallpaper -------------------------------------------------------------
[wallpaper]
enabled = true
fill_mode = "crop"
directory = "~/.config/sway/walls"

# --- Theme (Gruvbox, matching the Sway palette) ----------------------------
[theme]
mode = "dark"
source = "builtin"
builtin = "Gruvbox"
pure_black_dark = false

# --- Bar (modified TopBar with custom widgets) -----------------------------
[bar]
order = [ "topbar-right" ]

[bar.topbar-right]
auto_hide = true
concave_edge_corners = false
font_family = "Iosevka"
reserve_space = false
start = [ "workspaces" ]
end = [
    "sysmon",
    "temp",
    "cpu",
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "volume",
    "brightness",
    "battery"
]

# --- Dock (disabled) -------------------------------------------------------
[dock]
enabled = false

# --- Notifications ---------------------------------------------------------
[notification]
enable_daemon = true
show_app_name = true
show_actions = true
background_opacity = 0.97

# --- OSD --------------------------------------------------------------------
[osd]
position = "top_right"
background_opacity = 0.97

# --- Lock screen & idle ------------------------------------------------------
[lockscreen]
enabled = true
blur_intensity = 0.5

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

# --- Session actions (suspend / reboot / poweroff) ----------------------------
# By default Noctalia runs `sudo -n ...`, which fails without NOPASSWD.
# systemctl goes through logind/polkit; for the active session it is allowed
# without a password (verified with pkcheck for login1.power-off/reboot/suspend).
[shell.session.power]
suspend = "systemctl suspend"
reboot = "systemctl reboot"
shutdown = "systemctl poweroff"

# --- Audio -------------------------------------------------------------------
[audio]
enable_overdrive = false
enable_sounds = false

# --- Brightness --------------------------------------------------------------
[brightness]
enable_ddcutil = false

# --- Location & weather ------------------------------------------------------
[location]
auto_locate = true

[weather]
enabled = true
unit = "celsius"
effects = true

# --- System ------------------------------------------------------------------
[system.monitor]
enabled = true
